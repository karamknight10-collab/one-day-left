<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Day Left</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
  position:relative;
  overflow:hidden;
}

.screen.active{
  display:flex;
}

.content{
  width:min(850px,100%);
  text-align:center;
  position:relative;
  z-index:2;
  animation:appear .8s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.glow{
  width:500px;
  height:500px;
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.05);
  filter:blur(110px);
  animation:pulse 7s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.9);
    opacity:.3;
  }
  50%{
    transform:scale(1.2);
    opacity:.8;
  }
}

.label{
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
  margin-bottom:28px;
}

h1{
  font-size:clamp(55px,10vw,115px);
  line-height:.92;
  font-weight:300;
  letter-spacing:-6px;
}

h1 em{
  font-family:Georgia,serif;
  font-weight:400;
}

h2{
  font-size:clamp(38px,7vw,75px);
  font-weight:300;
  line-height:1;
  letter-spacing:-4px;
  margin-bottom:25px;
}

.subtitle{
  max-width:600px;
  margin:0 auto 38px;
  color:rgba(255,255,255,.45);
  line-height:1.8;
}

.btn{
  border:0;
  border-radius:100px;
  padding:16px 30px;
  background:white;
  color:black;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);
}

.language-grid,
.choices{
  max-width:750px;
  margin:35px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.language,
.choice{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  color:white;
  border-radius:20px;
  padding:27px 15px;
  cursor:pointer;
  transition:.3s;
}

.language:hover,
.choice:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.4);
  transform:translateY(-4px);
}

.language .flag{
  display:block;
  font-size:35px;
  margin-bottom:13px;
}

.language span:last-child{
  display:block;
  margin-top:7px;
  font-size:11px;
  color:rgba(255,255,255,.35);
}

.choice{
  min-height:120px;
}

.choice.selected{
  background:white;
  color:black;
  border-color:white;
}

.question-number{
  color:rgba(255,255,255,.3);
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:18px;
}

.result-card{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.035);
  padding:35px;
  border-radius:25px;
  margin:30px auto;
  max-width:650px;
}

.result-type{
  font-family:Georgia,serif;
  font-size:42px;
  margin-bottom:15px;
}

.result-description{
  color:rgba(255,255,255,.5);
  line-height:1.8;
}

.stat{
  margin:20px auto;
  max-width:650px;
  text-align:left;
}

.stat-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  color:rgba(255,255,255,.65);
  font-size:13px;
}

.bar{
  width:100%;
  height:6px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.bar-fill{
  height:100%;
  background:white;
  transition:1.2s ease;
}

.final{
  font-family:Georgia,serif;
  font-size:clamp(40px,7vw,80px);
  line-height:1.1;
}

.thanks{
  margin-top:55px;
  color:rgba(255,255,255,.4);
  line-height:1.8;
}

body.rtl{
  direction:rtl;
}

body.rtl .label{
  letter-spacing:1px;
}

body.rtl .stat{
  text-align:right;
}

@media(max-width:700px){

  .language-grid,
  .choices{
    grid-template-columns:1fr 1fr;
  }

  h1{
    letter-spacing:-3px;
  }
}

@media(max-width:450px){

  .language-grid,
  .choices{
    grid-template-columns:1fr;
  }

  h2{
    letter-spacing:-2px;
  }
}
</style>
</head>

<body>

<section class="screen active" id="language">
  <div class="glow"></div>

  <div class="content">
    <div class="label">One Day Left</div>

        <span>Darija</span>
      </button>

      <button class="language" onclick="chooseLanguage('en')">
        <span class="flag">🇬🇧</span>
        <strong>English</strong>
        <span>English</span>
      </button>

      <button class="language" onclick="chooseLanguage('fr')">
        <span class="flag">🇫🇷</span>
        <strong>Français</strong>
        <span>Français</span>
      </button>

    </div>
  </div>
</section>


<section class="screen" id="credit">

<section class="screen" id="question">

</section>


<section class="screen" id="result">

    </div>

    <div id="stats"></div>

    <p class="subtitle" id="resultMessage"></p>

    <button class="btn" id="finishBtn" onclick="showFinal()"></button>

  </div>

</section>


<section class="screen" id="final">

  <div class="content">

    <div class="label" id="finalLabel"></div>

    <div class="final" id="finalText"></div>

    <div class="thanks" id="thanks"></div>

    <br>

    <button class="btn" id="restartBtn" onclick="restart()"></button>

  </div>

</section>

function show(id){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  const target=document.getElementById(id);

  target.classList.add("active");

  const content=target.querySelector(".content");

  if(content){
    content.style.animation="none";
    void content.offsetWidth;
    content.style.animation="appear .8s ease";
  }

  window.scrollTo(0,0);
}


function chooseLanguage(lang){

  language=lang;

  document.documentElement.lang=lang;

  document.body.classList.toggle(
    "rtl",
    lang==="ar" || lang==="ma"
  );

  const t=T[language];

  document.getElementById("creditText").innerHTML=t.credit;

  show("credit");

  setTimeout(()=>{
    updateIntro();
    show("intro");
  },2300);
}


function updateIntro(){

  const t=T[language];

  document.getElementById("introLabel").innerHTML=t.introLabel;

  document.getElementById("introTitle").innerHTML=t.introTitle;

  document.getElementById("introSubtitle").innerHTML=t.introSubtitle;

  document.getElementById("startBtn").innerHTML=t.start;
}


function startTest(){

  currentQuestion=0;

  answers={};

  stats={
    empathy:0,
    creativity:0,
    curiosity:0,
    logic:0,
    courage:0,
    selfAwareness:0,
    connection:0
  };

  /*
    كل مرة نبدأ الاختبار يتم اختيار
    عدد عشوائي من 10 إلى 15 سؤال.
  */

  const count=10+Math.floor(Math.random()*6);

  testQuestions=[...questions]
    .sort(()=>Math.random()-0.5)
    .slice(0,count);

  renderQuestion();
}


function renderQuestion(){

  const q=testQuestions[currentQuestion];

  const t=T[language];

  document.getElementById("questionNumber").innerHTML=
    `${t.question} ${currentQuestion+1} / ${testQuestions.length}`;

  document.getElementById("questionTitle").innerHTML=
    q.text[language];

  document.getElementById("questionSubtitle").innerHTML=
    t.choose;

  const container=
    document.getElementById("questionChoices");

  container.innerHTML="";

  q.options.forEach((option,index)=>{

    const button=document.createElement("button");

    button.className="choice";

    button.innerHTML=option[language];

    button.onclick=()=>{

      container
        .querySelectorAll(".choice")
        .forEach(b=>{
          b.classList.remove("selected");
        });

      button.classList.add("selected");

      answers[currentQuestion]=option.score;
    };

    container.appendChild(button);
  });

  document.getElementById("nextBtn").innerHTML=
    currentQuestion===testQuestions.length-1
      ? t.finish
      : t.next;

  show("question");
}


function nextQuestion(){

  const answer=answers[currentQuestion];

  if(!answer){

    const messages={
      en:"Choose an answer first.",
      ar:"اختر إجابة أولًا.",
      ma:"ختار جواب الأول.",
      fr:"Choisissez d'abord une réponse."
    };

    alert(messages[language]);

    return;
  }

  Object.keys(answer).forEach(key=>{
    stats[key]+=answer[key];
  });

  currentQuestion++;

  if(currentQuestion>=testQuestions.length){
    calculateResult();
  }else{
    renderQuestion();
  }
}


function calculateResult(){

  const scores=stats;

  let type="dreamer";

  if(
    scores.creativity>=scores.curiosity &&
    scores.creativity>=scores.connection &&
    scores.creativity>=scores.logic
  ){
    type="creator";
  }

  if(
    scores.curiosity>scores.creativity &&
    scores.curiosity>=scores.connection &&
    scores.curiosity>=scores.logic
  ){
    type="explorer";
  }

  if(
    scores.logic>scores.curiosity &&
    scores.logic>=scores.connection &&
    scores.logic>=scores.creativity
  ){
    type="thinker";
  }

  if(
    scores.connection>scores.logic &&
    scores.connection>=scores.curiosity &&
    scores.connection>=scores.creativity
  ){
    type="guardian";
  }

  if(
    scores.selfAwareness>=
    Math.max(
      scores.creativity,
      scores.curiosity,
      scores.logic,
      scores.connection
    )
  ){
    type="dreamer";
  }

  showResult(type);
}


function showResult(type){

  document.getElementById("resultLabel").innerHTML=

  const statsContainer=

  const maxValues={
    empathy:60,
    creativity:60,

    const percentage=Math.round(

  document.documentElement.lang="en";

  document.body.classList.remove("rtl");

  show("language");
