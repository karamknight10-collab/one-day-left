<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Day Left</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      transition: direction .3s;
    }

    button {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .glow {
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: rgba(255,255,255,.055);
      filter: blur(120px);
      animation: breathe 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%,100% {
        transform: scale(1);
        opacity: .4;
      }

      50% {
        transform: scale(1.25);
        opacity: .9;
      }
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(900px, 100%);
      text-align: center;
    }

    .label {
      color: rgba(255,255,255,.38);
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 11px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(52px, 9vw, 110px);
      line-height: .95;
      font-weight: 300;
      letter-spacing: -5px;
    }

    h1 em {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    h2 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: -3px;
      margin-bottom: 20px;
    }

    .subtitle {
      color: rgba(255,255,255,.45);
      line-height: 1.8;
      max-width: 550px;
      margin: 0 auto 40px;
    }

    .btn {
      border: 0;
      background: #fff;
      color: #000;
      border-radius: 100px;
      padding: 16px 28px;
      cursor: pointer;
      transition: .3s;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      background: #eee;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 700px;
      margin: 35px auto;
    }

    .choice {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.035);
      color: #fff;
      border-radius: 20px;
      padding: 28px 15px;
      cursor: pointer;
      transition: .3s;
    }

    .choice:hover {
      border-color: rgba(255,255,255,.45);
      background: rgba(255,255,255,.08);
      transform: translateY(-4px);
    }

    .choice.selected {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .emoji {
      display: block;
      font-size: 35px;
      margin-bottom: 12px;
    }

    .choice small {
      display: block;
      margin-top: 7px;
      opacity: .45;
    }

    .progress {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.3);
      font-size: 11px;
      letter-spacing: 3px;
    }

    .timeline {
      max-width: 650px;
      margin: 40px auto;
      text-align: left;
    }

    .event {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 20px;
      padding: 22px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .time {
      color: rgba(255,255,255,.35);
      font-size: 13px;
      padding-top: 4px;
    }

    .event h3 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 6px;
    }

    .event p {
      color: rgba(255,255,255,.4);
      font-size: 14px;
    }

    .final-text {
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 85px);
      line-height: 1.05;
    }

    .final-text span {
      color: rgba(255,255,255,.35);
    }

    .language-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 650px;
      margin: 40px auto;
    }

    .language {
      padding: 30px 15px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.035);
      color: white;
      cursor: pointer;
      transition: .3s;
    }

    .language:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.4);
    }

    .language .flag {
      display: block;
      font-size: 38px;
      margin-bottom: 15px;
    }

    .language strong {
      font-size: 16px;
      font-weight: 400;
    }

    .language span {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      color: rgba(255,255,255,.35);
    }

    .fade {
      animation: fade .8s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body.rtl {
      direction: rtl;
    }

    body.rtl .label {
      letter-spacing: 1px;
    }

    body.rtl h1,
    body.rtl h2 {
      letter-spacing: 0;
    }

    body.rtl .timeline {
      text-align: right;
    }

    body.rtl .event {
      grid-template-columns: 1fr 80px;
    }

    body.rtl .event .time {
      order: 2;
    }

    body.rtl .event > div:last-child {
      order: 1;
    }

    @media(max-width: 650px) {
      .choices,
      .language-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        letter-spacing: -3px;
      }

      .choice,
      .language {
        padding: 22px;
      }

      .event {
        grid-template-columns: 65px 1fr;
      }

      body.rtl .event {
        grid-template-columns: 1fr 65px;
      }
    }
  </style>
</head>

      </div>

      <button class="btn" id="placeButton" onclick="goNext('place', 'activity')"></button>

    </div>

  <!-- ACTIVITY -->

      <button class="btn" id="createButton" onclick="buildDay()"></button>

      <button class="btn" id="restartButton" onclick="restart()"></button>

    function setLanguage(lang) {

      language = lang;

      localStorage.setItem("oneDayLeftLanguage", lang);

      document.documentElement.lang = lang;

      document.body.classList.toggle("rtl", lang === "ar");

      updateText();

      next("intro");
    }


    function updateText() {

      const t = translations[language];

      document.getElementById("introLabel").innerHTML = t.introLabel;

      document.getElementById("introTitle").innerHTML = t.introTitle;

      document.getElementById("introSubtitle").innerHTML = t.introSubtitle;

      document.getElementById("startButton").innerHTML = t.start;

      document.getElementById("peopleLabel").innerHTML = t.peopleLabel;

      document.getElementById("peopleTitle").innerHTML = t.peopleTitle;

      document.getElementById("peopleSubtitle").innerHTML = t.peopleSubtitle;

      document.getElementById("peopleButton").innerHTML = t.continue;

      document.getElementById("placeLabel").innerHTML = t.placeLabel;

      document.getElementById("placeTitle").innerHTML = t.placeTitle;

      document.getElementById("placeSubtitle").innerHTML = t.placeSubtitle;

      document.getElementById("placeButton").innerHTML = t.continue;

      document.getElementById("activityLabel").innerHTML = t.activityLabel;

      document.getElementById("activityTitle").innerHTML = t.activityTitle;

      document.getElementById("activitySubtitle").innerHTML = t.activitySubtitle;

      document.getElementById("createButton").innerHTML = t.create;

      document.getElementById("resultLabel").innerHTML = t.resultLabel;

      document.getElementById("resultTitle").innerHTML = t.resultTitle;

      document.getElementById("resultSubtitle").innerHTML = t.resultSubtitle;

      document.getElementById("resultButton").innerHTML = t.resultContinue;

      document.getElementById("finalLabel").innerHTML = t.finalLabel;

      document.getElementById("finalMain").innerHTML = t.finalMain;

      document.getElementById("finalSecond").innerHTML = t.finalSecond;

      document.getElementById("finalSubtitle").innerHTML = t.finalSubtitle;

      document.getElementById("restartButton").innerHTML = t.restart;


      document.querySelectorAll("[data-text]").forEach(element => {

        const key = element.getAttribute("data-text");

        if (t[key]) {
          element.innerHTML = t[key];
        }

      });

    }


    function next(id) {

      document.querySelectorAll(".screen").forEach(screen => {

        screen.classList.remove("active");

      });


      const target = document.getElementById(id);

      target.classList.add("active");


      const content = target.querySelector(".content");

      if (content) {

        content.classList.remove("fade");

        void content.offsetWidth;

        content.classList.add("fade");

      }


      window.scrollTo(0, 0);

    }


    function selectChoice(element, type, value) {

      const parent = element.closest(".choices");

      parent.querySelectorAll(".choice").forEach(button => {

        button.classList.remove("selected");

      });


      element.classList.add("selected");

      data[type] = value;

    }


    function goNext(type, nextScreen) {

      if (!data[type]) {

        alert(
          language === "ar"
            ? "اختر خيارًا أولًا."
            : language === "fr"
              ? "Choisissez d'abord une option."
              : "Choose one option first."
        );

        return;

      }


      next(nextScreen);

    }

      if (!data.activity) {

        alert(
          language === "ar"
            ? "اختر خيارًا أولًا."
            : language === "fr"

        );

        return;

      const t = translations[language];

      const personText = t[data.person];

      const activityText = t[data.activity];


      const timeline = document.getElementById("timeline");


      timeline.innerHTML = `

        <div class="event">

          <div class="time">08:00</div>

          <div>

            <h3>${t.wake}</h3>

            <p>${t.wakeText}</p>

          </div>

        </div>


        <div class="event">

          <div class="time">10:00</div>

          <div>

            <h3>${personText}</h3>

            <p>${t.selectedPersonText}</p>

          </div>

        </div>


        <div class="event">

          <div class="time">13:00</div>

          <div>

            <h3>${placeText}</h3>

            <p>${t.selectedPlaceText}</p>

          </div>

        </div>


        <div class="event">

          <div class="time">17:30</div>

          <div>

            <h3>${activityText}</h3>

            <p>${t.selectedActivityText}</p>

          </div>

        </div>


        <div class="event">

          <div class="time">20:00</div>

          <div>

            <h3>${t.sunsetEvent}</h3>

            <p>${t.sunsetText}</p>

          </div>

        </div>


        <div class="event">

          <div class="time">23:59</div>

          <div>

            <h3>${t.finalEvent}</h3>

            <p>${t.finalEventText}</p>

          </div>

        </div>

      `;


      next("result");

    }


    function restart() {

      data.person = "";

      data.place = "";

      data.activity = "";

      document.querySelectorAll(".choice").forEach(button => {

        button.classList.remove("selected");

      });

      next("intro");

    }


    const savedLanguage =
      localStorage.getItem("oneDayLeftLanguage");


    if (savedLanguage && translations[savedLanguage]) {

      language = savedLanguage;

      document.documentElement.lang = language;

      document.body.classList.toggle("rtl", language === "ar");

      updateText();

      next("intro");

    }

  </script>

</body>
</html>
