<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Day Left</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  transition:.4s;
}

button{
  font:inherit;
}

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
  position:relative;
  overflow:hidden;
}

.screen.active{
  display:flex;
}

.content{
  width:min(850px,100%);
  text-align:center;
  position:relative;
  z-index:2;
  animation:appear .8s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.glow{
  width:500px;
  height:500px;
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.05);
  filter:blur(110px);
  animation:pulse 7s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.9);
    opacity:.3;
  }
  50%{
    transform:scale(1.2);
    opacity:.8;
  }
}

.label{
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
  margin-bottom:28px;
}

h1{
  font-size:clamp(55px,10vw,115px);
  line-height:.92;
  font-weight:300;
  letter-spacing:-6px;
}

h1 em{
  font-family:Georgia,serif;
  font-weight:400;
}

h2{
  font-size:clamp(38px,7vw,75px);
  font-weight:300;
  line-height:1;
  letter-spacing:-4px;
  margin-bottom:25px;
}

.subtitle{
  max-width:600px;
  margin:0 auto 38px;
  color:rgba(255,255,255,.45);
  line-height:1.8;
}

.btn{
  border:0;
  border-radius:100px;
  padding:16px 30px;
  background:white;
  color:black;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);
}

.language-grid,
.choices{
  max-width:750px;
  margin:35px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.language,
.choice{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  color:white;
  border-radius:20px;
  padding:27px 15px;
  cursor:pointer;
  transition:.3s;
}

.language:hover,
.choice:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.4);
  transform:translateY(-4px);
}

.language .flag{
  display:block;
  font-size:35px;
  margin-bottom:13px;
}

.language span:last-child{
  display:block;
  margin-top:7px;
  font-size:11px;
  color:rgba(255,255,255,.35);
}

.choice{
  min-height:130px;
}

.choice.selected{
  background:white;
  color:black;
  border-color:white;
}

.emoji{
  display:block;
  font-size:32px;
  margin-bottom:12px;
}

.progress{
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  letter-spacing:3px;
  color:rgba(255,255,255,.3);
}

.question-number{
  color:rgba(255,255,255,.3);
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:18px;
}

.scale{
  max-width:650px;
  margin:35px auto;
  padding:20px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
}

.scale input{
  width:100%;
}

.timeline{
  max-width:650px;
  margin:40px auto;
  text-align:left;
}

.stat{
  margin:20px 0;
  text-align:left;
}

.stat-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  color:rgba(255,255,255,.65);
  font-size:13px;
}

.bar{
  width:100%;
  height:6px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0;
  background:white;
  transition:1.2s ease;
}

.result-card{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.035);
  padding:35px;
  border-radius:25px;
  margin:30px auto;
  max-width:650px;
}

.result-type{
  font-family:Georgia,serif;
  font-size:42px;
  margin-bottom:15px;
}

.result-description{
  color:rgba(255,255,255,.5);
  line-height:1.8;
}

.event{
  padding:22px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.event h3{
  font-weight:400;
  margin-bottom:8px;
}

.event p{
  color:rgba(255,255,255,.4);
  line-height:1.6;
}

.final{
  font-family:Georgia,serif;
  font-size:clamp(40px,7vw,80px);
  line-height:1.1;
}

.thanks{
  margin-top:55px;
  color:rgba(255,255,255,.4);
  line-height:1.8;
}

body.rtl{
  direction:rtl;
}

body.rtl h1,
body.rtl h2{
  letter-spacing:0;
}

body.rtl .label{
  letter-spacing:1px;
}

body.rtl .timeline,
body.rtl .stat{
  text-align:right;
}

@media(max-width:700px){

  .language-grid,
  .choices{
    grid-template-columns:1fr 1fr;
  }

  h1{
    letter-spacing:-3px;
  }
}

@media(max-width:450px){

  .language-grid,
  .choices{
    grid-template-columns:1fr;
  }

  h2{
    letter-spacing:-2px;
  }
}
</style>
</head>

<button class="btn" id="restartBtn" onclick="restart()"></button>

</div>
</section>

function getText(obj){
  return obj[language] || obj.en;
}


function chooseLanguage(lang){

  language = lang;

  localStorage.setItem("oneDayLeftLanguage",lang);

  document.documentElement.lang = lang;

  document.body.classList.toggle("rtl",lang==="ar" || lang==="ma");

  const t=T[lang];

  document.getElementById("creditText").innerHTML=t.credit;

  show("credit");

  setTimeout(()=>{
    show("intro");
    updateIntro();
  },2300);

}


function updateIntro(){

  const t=T[language];

  document.getElementById("introLabel").innerHTML=t.introLabel;

  document.getElementById("introTitle").innerHTML=t.introTitle;

  document.getElementById("introSubtitle").innerHTML=t.introSubtitle;

  document.getElementById("startBtn").innerHTML=t.start;

}


function show(id){

  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
  });

  const target=document.getElementById(id);

  target.classList.add("active");

  const content=target.querySelector(".content");

  if(content){

    content.style.animation="none";

    void content.offsetWidth;

    content.style.animation="appear .8s ease";

  }

  window.scrollTo(0,0);

}


function startTest(){

  currentQuestion=0;

  answers={};

  stats={
    empathy:0,
    creativity:0,
    curiosity:0,
    logic:0,
    courage:0,
    selfAwareness:0,
    connection:0
  };

  /*
  اختيار 10 إلى 15 سؤال.
  */

  const count=10+Math.floor(Math.random()*6);

  window.testQuestions=[...questions]
    .sort(()=>Math.random()-.5)
    .slice(0,count);

  renderQuestion();

}


function renderQuestion(){

  const q=window.testQuestions[currentQuestion];

  const t=T[language];

  document.getElementById("questionNumber").innerHTML=
    `${t.question} ${currentQuestion+1} / ${window.testQuestions.length}`;

  document.getElementById("questionTitle").innerHTML=
    getText(q.text);

  document.getElementById("questionSubtitle").innerHTML=
    t.choose;

  const container=document.getElementById("questionChoices");

  container.innerHTML="";

  q.options.forEach((option,index)=>{

    const button=document.createElement("button");

    button.className="choice";

    button.innerHTML=getOptionText(option);

    button.onclick=()=>{

      container.querySelectorAll(".choice").forEach(b=>{
        b.classList.remove("selected");
      });

      button.classList.add("selected");

      answers[currentQuestion]=option[4];

    };

    container.appendChild(button);

  });

  document.getElementById("nextBtn").innerHTML=
    currentQuestion===window.testQuestions.length-1
      ? t.finish
      : t.next;

  show("question");

}


function getOptionText(option){

  if(language==="en") return option[0];

  if(language==="ar") return option[1];

  if(language==="ma") return option[2];

  if(language==="fr") return option[3];

  return option[0];

}


function nextQuestion(){

  const answer=answers[currentQuestion];

  if(!answer){

    const messages={
      en:"Choose an answer first.",
      ar:"اختر إجابة أولًا.",
      ma:"ختار جواب الأول.",
      fr:"Choisissez d'abord une réponse."
    };

    alert(messages[language]);

    return;

  }

  Object.keys(answer).forEach(key=>{
    stats[key]+=answer[key];
  });

  currentQuestion++;

  if(currentQuestion>=window.testQuestions.length){

    calculateResult();

  }else{

    renderQuestion();

  }

}


function calculateResult(){

  let type="dreamer";

  const scores=stats;

  if(scores.creativity>=scores.curiosity &&
     scores.creativity>=scores.connection &&
     scores.creativity>=scores.logic){

    type="creator";

  }

  if(scores.curiosity>scores.creativity &&
     scores.curiosity>=scores.connection &&
     scores.curiosity>=scores.logic){

    type="explorer";

  }

  if(scores.logic>scores.curiosity &&
     scores.logic>=scores.connection &&
     scores.logic>=scores.creativity){

    type="thinker";

  }

  if(scores.connection>scores.logic &&
     scores.connection>=scores.curiosity &&
     scores.connection>=scores.creativity){

    type="guardian";

  }

  if(
    scores.selfAwareness>=
    Math.max(
      scores.creativity,
      scores.curiosity,
      scores.logic,
      scores.connection
    )
  ){

    type="dreamer";

  }

  showResult(type);

}
