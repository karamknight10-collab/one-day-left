<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One Day Left</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      filter: blur(120px);
      animation: breathe 7s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    .top {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      white-space: nowrap;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 30px;
      animation: fadeUp 1.2s ease forwards;
    }

    h1 {
      font-size: clamp(52px, 9vw, 115px);
      line-height: 0.95;
      font-weight: 300;
      letter-spacing: -5px;
      animation: fadeUp 1.4s ease forwards;
    }

    h1 em {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .description {
      margin: 35px auto 0;
      max-width: 480px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.8;
      font-size: 16px;
      animation: fadeUp 1.8s ease forwards;
    }

    .start {
      margin-top: 45px;
      padding: 17px 30px;
      border-radius: 50px;
      border: none;
      background: white;
      color: black;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s ease;
      animation: fadeUp 2s ease forwards;
    }

    .start:hover {
      transform: scale(1.06);
      background: #e8e8e8;
    }

    .scroll {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, 8px);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .experience {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .experience h2 {
      font-size: clamp(35px, 6vw, 70px);
      font-weight: 300;
      margin-bottom: 20px;
    }

    .experience p {
      color: rgba(255, 255, 255, 0.45);
      max-width: 500px;
      margin: auto;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="glow"></div>

    <div class="top">
      One Day Left
    </div>

    <div class="content">

      <div class="eyebrow">
        Imagine this
      </div>

      <h1>
        What if today<br>
        was your <em>last?</em>
      </h1>

      <p class="description">
        Forget tomorrow.<br>
        Forget yesterday.<br>
        You only have today.
      </p>

      <button
        class="start"
        onclick="document.getElementById('experience').scrollIntoView()"
      >
        Begin the experience →
      </button>

    </div>

    <div class="scroll">
      Scroll ↓
    </div>

  </section>


  <section class="experience" id="experience">

    <div>

      <h2>
        Who would you<br>
        spend it with?
      </h2>

      <p>
        This is where your journey begins.
        Soon, you'll build your perfect final day.
      </p>

    </div>

  </section>

</body>
</html>
